<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 12px;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #0d8ee0;
    }
  </style>
</head>
<body>
  <textarea id="html-input" placeholder="Paste HTML here..."></textarea>
  <button id="convert-btn">Convert</button>

  <!-- Hidden render iframe: loads pasted HTML to compute real layout -->
  <iframe id="render-frame" style="display:none" sandbox="allow-same-origin"></iframe>

  <script>
    __UI_SCRIPT__
  </script>
</body>
</html>
