<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      font-family: Inter, sans-serif;
      margin: 0;
      padding: 12px;
      font-size: 12px;
    }
    textarea {
      width: 100%;
      height: 220px;
      box-sizing: border-box;
      font-family: monospace;
      font-size: 11px;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      width: 100%;
      padding: 8px;
      background: #18a0fb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    button:hover {
      background: #0d8ee0;
    }
  </style>
</head>
<body>
  <textarea id="html-input" placeholder="Paste HTML here..."></textarea>
  <button id="convert-btn">Convert</button>

  <!-- Render iframe: positioned off-screen (not display:none) so the
       browser still lays it out and getBoundingClientRect stays accurate -->
  <iframe
    id="render-frame"
    sandbox="allow-same-origin"
    style="position:absolute; top:-10000px; left:-10000px; width:1440px; height:800px; border:none;"
  ></iframe>

  <script>
    __UI_SCRIPT__
  </script>
</body>
</html>
